name: Wine example
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  wine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.27.3'
          cache: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.15'
      - run: python -m pip install --require-hashes -r examples/wine/requirements.lock
      - run: python -m unittest discover -s examples/wine -p 'test_*.py'
      - run: python -m unittest discover -s examples/wine_catalog -p 'test_*.py'
      - run: |
          cp -r examples/wine /tmp/wine-a
          cp -r examples/wine /tmp/wine-b
          python /tmp/wine-a/pipeline.py run --phase validation --root /tmp/wine-a --out /tmp/result-a
          python /tmp/wine-b/pipeline.py run --phase validation --root /tmp/wine-b --out /tmp/result-b
          python /tmp/wine-a/pipeline.py compare --root-a /tmp/wine-a --a /tmp/result-a --root-b /tmp/wine-b --b /tmp/result-b
